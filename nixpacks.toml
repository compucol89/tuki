[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run production"
]

[start]
cmd = "php -d upload_max_filesize=8M -d post_max_size=12M -d memory_limit=512M -d zlib.output_compression=1 -d zlib.output_compression_level=5 -S 0.0.0.0:8080 -t public public/index.php"
